[project]
name = "auditor-resources"
version = "0.1.0"
# <3.14: inspect_scout (via inspect-petri) uses typing forms removed in 3.14
requires-python = ">=3.12,<3.14"
# inspect-harbor was dropped along with the benchmark data layer (see README
# "Previously") — nothing imports its task registry now that scenarios come
# from GitHub repos. inspect-evals is back, scoped to data/transcripts/ only,
# for pulling task-level results from upstream Inspect evals — as is
# impossiblebench, which supplies the reward-hacking benchmark and is an
# Inspect implementation itself, so its logs need no special handling. Neither
# is pinned here; uv.lock pins the resolved commit of both.
dependencies = [
    "impossiblebench",
    "inspect-ai>=0.3.277",
    "inspect-evals",
    "inspect-petri>=3.0.11",
    "ipykernel>=7.3.0",
    "krippendorff>=0.8.2",
    "matplotlib>=3.11.0",
    "openai>=2.45.0",
    "python-dotenv>=1.2.2",
    "statsmodels>=0.14.6",
    "tabulate>=0.10.0",
]

[tool.uv.sources]
inspect-evals = { git = "https://github.com/UKGovernmentBEIS/inspect_evals" }
impossiblebench = { git = "https://github.com/safety-research/impossiblebench" }
