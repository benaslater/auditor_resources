[project]
name = "auditor-resources"
version = "0.1.0"
# <3.14: inspect_scout (via inspect-petri) uses typing forms removed in 3.14
requires-python = ">=3.12,<3.14"
# The Inspect stack is pinned exactly to what produced every log in the
# released dataset (each .eval records its own package versions). Newer
# inspect-ai needs openai>=3.4, which the code here is not tested against.
# inspect-evals supplies the sycophancy and AgentHarm benchmarks, and
# impossiblebench the reward-hacking one, for data/transcripts/; both are
# pinned to the commits those collections ran at.
dependencies = [
    "huggingface-hub>=1.16.1",
    "impossiblebench",
    "inspect-ai==0.3.247",
    "inspect-evals",
    "inspect-petri==3.0.11",
    "ipykernel>=7.3.0",
    "krippendorff>=0.8.2",
    "matplotlib>=3.11.0",
    "openai>=2.45.0",
    "python-dotenv>=1.2.2",
    "statsmodels>=0.14.6",
    "tabulate>=0.10.0",
]

[tool.uv.sources]
inspect-evals = { git = "https://github.com/UKGovernmentBEIS/inspect_evals", rev = "6a35510e530f236fd1dbcd9df888f01937c8494a" }
impossiblebench = { git = "https://github.com/safety-research/impossiblebench", rev = "061dc3dce6a96ab6cf02a855157263033dcfa3ba" }
